<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zeamistrap — Roblox 用カスタムブートストラッパー</title>
    <meta name="description" content="Zeamistrap は Roblox 用のカスタムブートストラッパーです。Bloxstrap をベースに、詳細なサーバー情報・FastFlags エディタ・フレームレートキャップの引き上げなどの機能を提供します。Windows 10 / 11 対応。">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <header class="topbar">
        <span class="brand">Zeamistrap</span>
        <nav class="nav">
            <a href="https://github.com/ze4m1/Zeamistrap/releases/latest">最新リリース</a>
            <a href="https://github.com/ze4m1/Zeamistrap">ソースコード</a>
            <a href="https://github.com/ze4m1/Zeamistrap/issues">フィードバック</a>
        </nav>
    </header>

    <main id="top">
        <section class="hero center">
            <div class="hero-inner">
                <h1 class="visually-hidden">Zeamistrap</h1>
                <div class="logo-wrap">
                    <img class="logo dark-only" src="assets/zerostrap-dark.png" alt="" aria-hidden="true">
                    <img class="logo light-only" src="assets/zerostrap-light.png" alt="" aria-hidden="true">
                </div>

                <p class="tagline">
                    Bloxstrap をベースにした Roblox 用カスタムブートストラッパー。
                    サーバー情報・FastFlags エディタ・フレームレートキャップの引き上げなどを利用できます。
                </p>

                <div class="cta">
                    <a class="btn big" href="https://github.com/ze4m1/Zeamistrap/releases/latest">
                        ダウンロード
                    </a>
                </div>

                <p class="discord">
                    <a href="https://discord.gg/NnFbjSb45p">Discord サーバーに参加</a>
                </p>

                <p class="note">
                    Zeamistrap を入手できる公式の場所は、
                    <a href="https://github.com/ze4m1/Zeamistrap">この GitHub リポジトリ</a>
                    のみです。それ以外のサイトからダウンロードをしないでください。
                </p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>
            © Zeamistrap contributors ·
            <a href="https://github.com/ze4m1/Zeamistrap">GitHub</a>
        </p>
    </footer>

    <script src="assets/app.js"></script>
</body>
</html>
